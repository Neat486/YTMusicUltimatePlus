name: Build YTMusicUltimatePlus IPA
on:
  workflow_dispatch:
    inputs: 
      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube Music"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.google.ios.youtubemusic"
        required: true
        type: string
        
      upload_artifact:
        description: "Upload IPA as an Artifact (Public)"
        default: true
        required: false
        type: boolean

      catbox_upload:
        description: "Upload IPA to Catbox.moe (URL)"
        default: true
        required: false
        type: boolean
        
      draft_release:
        description: "Create a draft release (Private)"
        default: true
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YTMusicUltimatePlus IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Check Inputs
        if: ${{ !inputs.upload_artifact && !inputs.draft_release && !inputs.catbox_upload }}
        run: |
          echo "No IPA output way selected. Please choose at least one."
          exit 1

      - name: Hide Sensitive Inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
           exclude_inputs: bundle_id,display_name,draft_release,upload_artifact,catbox_upload

      - name: Download and Validate IPA
        run: |
          wget ${{ inputs.ipa_url }} --no-verbose -O ytm.ipa

          file_type=$(file --mime-type -b ytm.ipa)

          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Get YouTube Music Version 
        run: |
          unzip -q ytm.ipa -d ytmextracted
          echo "YTM_VERSION=$(grep -A 1 '<key>CFBundleVersion</key>' ytmextracted/Payload/YouTubeMusic.app/Info.plist | grep '<string>' | awk -F'[><]' '{print $3}')" >> $GITHUB_ENV
          echo -e 'Done!'

      - name: Install Dependencies
        run: brew install make ldid

      - name: Set PATH Environment Variable
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Clone Theos
        run: git clone --quiet --recurse-submodules https://github.com/theos/theos.git

      - name: Download iOS SDK
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs.git
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS17.5.sdk
          git checkout
          mv *.sdk $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Clone YTMusicUltimate 
        run: git clone --quiet https://github.com/dayanch96/YTMusicUltimate.git

      - name: Get YTMusicUltimate Version
        run: |
          cd YTMusicUltimate
          VERSION=$(grep '^PACKAGE_VERSION =' control | cut -d ' ' -f2)
          echo "YTMUSICULT_VERSION=$VERSION" >> $GITHUB_ENV
          echo -e 'Done!'

      - name: Clone YouTubeHeader
        run: |
          cd $THEOS/include
          git clone --quiet https://github.com/PoomSmart/YouTubeHeader.git
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Clone YouTubeMusicHeader
        run: |
          cd $THEOS/include
          git clone --quiet https://github.com/PoomSmart/YouTubeMusicHeader.git
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Clone NoYTMPremium
        run: git clone --quiet https://github.com/PoomSmart/NoYTMPremium.git

      - name: Clone YTMABConfig
        run: git clone --quiet https://github.com/PoomSmart/YTMABConfig.git

      - name: Build YTMusicUltimate
        run: |
          cd YTMusicUltimate
          sed -i '' -e 's/16.5/17.5/g' Makefile
          sed -i '' -e 's/YouTubeMusic/YouTube Music/g' Makefile
          make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ${{ github.workspace }}/ytmusicult.deb
        env:
          THEOS: ${{ github.workspace }}/theos
        
      - name: Build NoYTMPremium
        run: |
          cd NoYTMPremium
          make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ${{ github.workspace }}/noytmpremium.deb
        env:
          THEOS: ${{ github.workspace }}/theos    

      - name: Build YTMABConfig
        run: |
          cd YTMABConfig
          make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ${{ github.workspace }}/ytmab.deb
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Inject Tweaks Into IPA
        run: |
          tweaks="ytmusicult.deb"

          for f in *.deb; do
            if [ -f "$f" ]; then
              tweaks="$tweaks $f"
            fi
          done

          cyan -i ytm.ipa -o YTMusicUltimatePlus_${{ env.YTM_VERSION }}_v${{ env.YTMUSICULT_VERSION }}.ipa -uwef $tweaks -n "${{ inputs.display_name }}" -b ${{ inputs.bundle_id }} 

      - name: Upload IPA to Catbox
        if: ${{ inputs.catbox_upload }}
        run: |
          RESPONSE=$(curl -F "reqtype=fileupload" -F "fileToUpload=@YTMusicUltimatePlus_${{ env.YTM_VERSION }}_v${{ env.YTMUSICULT_VERSION }}.ipa" https://catbox.moe/user/api.php)
          CATBOX_URL=$(echo $RESPONSE | grep -o -E 'https://files.catbox.moe/[^"]*')
          echo "Uploaded artifact to $CATBOX_URL"
          CATBOX_FILE=$(echo $CATBOX_URL | sed 's|https://files.catbox.moe/||')
          echo "CATBOX_FILE=$CATBOX_FILE" >> $GITHUB_ENV
          echo "CATBOX_URL=$CATBOX_URL" >> $GITHUB_ENV

      - name: Upload IPA as an Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v5
        with:
          name: YTMusicUltimatePlus_${{ env.YTM_VERSION }}_v${{ env.YTMUSICULT_VERSION }}
          path: YTMusicUltimatePlus_${{ env.YTM_VERSION }}_v${{ env.YTMUSICULT_VERSION }}.ipa

      - name: Create a Draft Release
        if: ${{ inputs.draft_release }}
        uses: softprops/action-gh-release@v2.4.2
        with:
          tag_name: ytmultplus-ipa${{ github.run_number }}
          name: YTMusicUltimatePlus_${{ env.YTM_VERSION }}_v${{ env.YTMUSICULT_VERSION }} (${{ github.run_number }}) 
          files: YTMusicUltimatePlus_${{ env.YTM_VERSION }}_v${{ env.YTMUSICULT_VERSION }}.ipa
          draft: true

      - name: Job Summary - Build Conplete
        run: |
          echo -e '### 🛠️ Build YTMusicUltimatePlus IPA Complete!' >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Output the Artifact Upload
        if: ${{ inputs.upload_artifact }}
        run: |
          echo -e '### 📦 Artifact Upload\n\nUpload IPA as an artifact successfully! Refresh and [Scroll down](#artifacts) to view the artifact. Note that you must be signed in to GitHub to download it.' >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Output the IPA URL (Catbox Upload)
        if: ${{ inputs.catbox_upload }}
        run: |
          echo -e '### 🐱 Catbox Upload\n\nUpload IPA to Catbox successfully! Here is a permanent shareable link: '$CATBOX_URL >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Output a Draft Release Link
        if: ${{ inputs.draft_release }}
        run: |
          echo -e '### 🚀 Draft Release\n\nDraft release has been created successfully! You can view your release here: https://github.com/${{ github.repository }}/releases' >> $GITHUB_STEP_SUMMARY
     
      - name: Job Summary - Cleanup
        run: |
          echo -e '### 🧹 Cleanup\n\nYou can remove previous GitHub Actions run here: https://github.com/${{ github.repository }}/actions/workflows/delete-old-workflow-runs.yml And if you want to delelte old draft release you have then here: https://github.com/${{ github.repository }}/actions/workflows/delete-old-draft-releases.yml' >> $GITHUB_STEP_SUMMARY
